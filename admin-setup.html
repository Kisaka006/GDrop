<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Initial GDrop Administrator Setup</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172033; background: #f3f6f8; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem; box-sizing: border-box; }
    main { width: min(100%, 28rem); box-sizing: border-box; padding: 2rem; background: white; border: 1px solid #dfe5eb; border-radius: 1.25rem; box-shadow: 0 16px 48px #13223814; }
    h1 { margin: 0 0 .5rem; font-size: 1.5rem; }
    p { color: #526174; line-height: 1.5; font-size: .925rem; }
    label { display: block; margin-top: 1rem; font-size: .85rem; font-weight: 650; }
    input { display: block; box-sizing: border-box; width: 100%; margin-top: .4rem; padding: .7rem .75rem; border: 1px solid #c9d2dc; border-radius: .6rem; font: inherit; }
    button { width: 100%; margin-top: 1.35rem; padding: .8rem; border: 0; border-radius: .65rem; background: #047857; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { min-height: 1.5rem; margin-bottom: 0; }
    #status.error { color: #b42318; }
    #status.success { color: #067647; }
    .note { margin-top: 1.3rem; padding: .75rem; border-radius: .6rem; background: #f3f6f8; font-size: .8rem; }
  </style>
</head>
<body>
  <main>
    <h1>Set up the first administrator</h1>
    <p>This one-time form creates the initial GDrop admin account. Choose a unique password and save it in your password manager.</p>
    <form id="setup-form">
      <label for="setup-token">One-time setup key</label>
      <input id="setup-token" name="token" type="password" autocomplete="off" required minlength="32">
      <label for="name">Your full name</label>
      <input id="name" name="name" autocomplete="name" required minlength="5">
      <label for="email">Admin email</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="password">New password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required minlength="14">
      <label for="confirm-password">Confirm new password</label>
      <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required minlength="14">
      <button id="submit" type="submit">Create admin account</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <p class="note">The setup key and password are sent over HTTPS and are never placed in the page URL. Setup is disabled after the first admin is created.</p>
  </main>
  <script>
    const form = document.getElementById('setup-form');
    const status = document.getElementById('status');
    const button = document.getElementById('submit');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const values = new FormData(form);
      const password = String(values.get('password') || '');
      if (password !== String(values.get('confirmPassword') || '')) {
        status.textContent = 'Passwords do not match.';
        status.className = 'error';
        return;
      }
      button.disabled = true;
      status.textContent = 'Creating the initial admin account...';
      status.className = '';
      try {
        const response = await fetch('/admin/setup', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Admin-Setup-Token': String(values.get('token') || ''),
          },
          body: JSON.stringify({
            name: String(values.get('name') || ''),
            email: String(values.get('email') || ''),
            password,
          }),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Could not create the admin account.');
        form.reset();
        status.textContent = 'Admin account created. Go to the home page and sign in with your email and new password.';
        status.className = 'success';
      } catch (error) {
        status.textContent = error.message;
        status.className = 'error';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
